type Aktivitas {
    id: ID!
    bagian_id: ID!
    no_wbs: String
    nama: String!
    created_at: DateTime
    updated_at: DateTime
    deleted_at: DateTime

    bagian: Bagian @belongsTo
}

input CreateAktivitasInput {
    bagian_id: ID!
    no_wbs: String
    nama: String!
}

input UpdateAktivitasInput {
    id: ID!
    bagian_id: ID
    no_wbs: String
    nama: String
}

type AktivitasPaginator {
    data: [Aktivitas!]!
    PaginatorInfo: PageInfo!
}

extend type Query {
    allAktivitas: [Aktivitas!]!
        @all(model: "App\\Models\\ModelAktivitas")
        @softDeletes

    allAktivitasPaginate(search: String, first: Int, page: Int): AktivitasPaginator
        @field(resolver: "App\\GraphQL\\Queries\\Aktivitas\\AktivitasQuery@all")

    Aktivitas(id: ID! @eq(key: "id")): Aktivitas
        @find(model: "App\\Models\\ModelAktivitas")
        @softDeletes

    AktivitasByNama(
        nama: String! @where(operator: "like", key: "nama")
    ): [Aktivitas!]! @all(model: "App\\Models\\ModelAktivitas") @softDeletes

    allArsipAktivitas: [Aktivitas!]!
        @field(resolver: "App\\GraphQL\\Queries\\Aktivitas\\AktivitasQuery@showTrashed")
        @softDeletes
}

extend type Mutation {
    createAktivitasInput(input: CreateAktivitasInput @spread): Aktivitas
        @create(model: "App\\Models\\ModelAktivitas")

    updateAktivitasInput(input: UpdateAktivitasInput @spread): Aktivitas
        @update(model: "App\\Models\\ModelAktivitas")

    deleteAktivitas(id: ID! @eq(key: "id")): Aktivitas
        @delete(model: "App\\Models\\ModelAktivitas")

    restoreAktivitas(id: ID! @eq(key: "id")): Aktivitas
        @field(
            resolver: "App\\GraphQL\\Mutations\\Aktivitas\\AktivitasMutations@restore"
        )

    forceDeleteAktivitas(id: ID! @eq(key: "id")): Aktivitas
        @field(
            resolver: "App\\GraphQL\\Mutations\\Aktivitas\\AktivitasMutations@forceDelete"
        )
}
