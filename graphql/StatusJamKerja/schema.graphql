type StatusJamKerja {
    id: ID!
    nama: String!
    created_at: DateTime
    updated_at: DateTime
    deleted_at: DateTime
}

input CreateStatusJamKerjaInput {
    nama: String!
}

input UpdateStatusJamKerjaInput {
    id: ID!
    nama: String
}

type StatusJamKerjaPaginator {
    data: [StatusJamKerja!]!
    PaginatorInfo: PageInfo!
}

extend type Query {
    allStatusJamKerja: [StatusJamKerja!]!
        @all(model: "App\\Models\\ModelStatusJamKerja")
        @softDeletes

    allStatusJamKerjaPaginate(
        search: String
        first: Int
        page: Int
    ): StatusJamKerjaPaginator
        @field(
            resolver: "App\\GraphQL\\Queries\\StatusJamKerja\\StatusJamKerjaQuery@all"
        )

    StatusJamKerja(id: ID! @eq(key: "id")): StatusJamKerja
        @find(model: "App\\Models\\ModelStatusJamKerja")
        @softDeletes

    StatusJamKerjaByNama(
        nama: String! @where(operator: "like", key: "nama")
    ): [StatusJamKerja!]!
        @all(model: "App\\Models\\ModelStatusJamKerja")
        @softDeletes

    allArsipStatusJamKerja: [StatusJamKerja!]!
        @field(
            resolver: "App\\GraphQL\\Queries\\StatusJamKerja\\StatusJamKerjaQuery@showTrashed"
        )
        @softDeletes
}

extend type Mutation {
    createStatusJamKerjaInput(
        input: CreateStatusJamKerjaInput @spread
    ): StatusJamKerja @create(model: "App\\Models\\ModelStatusJamKerja")

    updateStatusJamKerjaInput(
        input: UpdateStatusJamKerjaInput @spread
    ): StatusJamKerja @update(model: "App\\Models\\ModelStatusJamKerja")

    deleteStatusJamKerja(id: ID! @eq(key: "id")): StatusJamKerja
        @delete(model: "App\\Models\\ModelStatusJamKerja")

    restoreStatusJamKerja(id: ID! @eq(key: "id")): StatusJamKerja
        @field(
            resolver: "App\\GraphQL\\Mutations\\StatusJamKerja\\StatusJamKerjaMutations@restore"
        )

    forceDeleteStatusJamKerja(id: ID! @eq(key: "id")): StatusJamKerja
        @field(
            resolver: "App\\GraphQL\\Mutations\\StatusJamKerja\\StatusJamKerjaMutations@forceDelete"
        )
}
