type Bagian {
    id: ID!
    nama: String!
    created_at: DateTime
    updated_at: DateTime

    usersProfiles: [UserProfile!]! @hasMany
}

input CreateBagianInput {
    nama: String!
}

input UpdateBagianInput {
    id: ID!
    nama: String
}

type PageInfo {
    hasMorePages: Boolean!
    currentPage: Int!
    lastPage: Int!
    perPage: Int!
    total: Int!
}

type BagianPaginator {
    data: [Bagian!]!
    PaginatorInfo: PageInfo!
}

extend type Query {
    allBagian: [Bagian!]! @all(model: "App\\Models\\ModelBagian")

    bagian(id: ID! @eq(key: "id")): Bagian
        @find(model: "App\\Models\\ModelBagian")

    BagianByNama(
        nama: String! @where(operator: "like", key: "nama")
    ): [Bagian!]! @all(model: "App\\Models\\ModelBagian")

    allBagianPaginate(search: String, first: Int, page: Int): BagianPaginator
        @field(resolver: "App\\GraphQL\\Queries\\bagian\\BagianQuery@all")
}

extend type Mutation {
    createBagianInput(input: CreateBagianInput @spread): Bagian
        @create(model: "App\\Models\\ModelBagian")

    updateBagianInput(input: UpdateBagianInput @spread): Bagian
        @update(model: "App\\Models\\ModelBagian")

    deleteBagian(id: ID! @eq(key: "id")): Bagian
        @delete(model: "App\\Models\\ModelBagian")
}
