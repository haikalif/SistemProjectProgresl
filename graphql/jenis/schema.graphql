type Jenis {
    id: ID!
    nama: String!
    created_at: DateTime
    updated_at: DateTime
    deleted_at: DateTime
}

input CreateJenisInput {
    nama: String!
}

input UpdateJenisInput {
    id: ID!
    nama: String!
}

type JenisPaginator {
    data: [Jenis!]!
    PaginatorInfo: PageInfo!
}

extend type Query {
    allJenis: [Jenis!]! @all(model: "App\\Models\\ModelJenisPesan") @softDeletes

    allJenisPaginate(search: String, first: Int, page: Int): JenisPaginator
        @field(resolver: "App\\GraphQL\\Queries\\Jenis\\JenisQuery@all")

    Jenis(id: ID! @eq(key: "id")): Jenis
        @find(model: "App\\Models\\ModelJenisPesan")
        @softDeletes

    JenisByNama(nama: String! @where(operator: "like", key: "nama")): [Jenis!]!
        @all(model: "App\\Models\\ModelJenisPesan")
        @softDeletes

    allArsipJenis: [Jenis!]!
        @field(resolver: "App\\GraphQL\\Queries\\Jenis\\JenisQuery@showTrashed")
        @softDeletes
}

extend type Mutation {
    createJenisInput(nama: String!): Jenis
        @create(model: "App\\Models\\ModelJenisPesan")

    updateJenisInput(id: ID!, nama: String!): Jenis
        @update(model: "App\\Models\\ModelJenisPesan")

    deleteJenis(id: ID! @eq(key: "id")): Jenis
        @delete(model: "App\\Models\\ModelJenisPesan")

    restoreJenis(id: ID! @eq(key: "id")): Jenis
        @field(
            resolver: "App\\GraphQL\\Mutations\\Jenis\\JenisMutations@restore"
        )

    forceDeleteJenis(id: ID! @eq(key: "id")): Jenis
        @field(
            resolver: "App\\GraphQL\\Mutations\\Jenis\\JenisMutations@forceDelete"
        )
}
