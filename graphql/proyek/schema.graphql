type Proyek {
    id: ID!
    kode: String!
    nama: String!
    tanggal: Date
    nama_sekolah: String
    created_at: DateTime
    updated_at: DateTime
    deleted_at: DateTime
}

input CreateProyekInput {
    kode: String!
    nama: String!
    tanggal: Date
    nama_sekolah: String
}

input UpdateProyekInput {
    id: ID!
    kode: String
    nama: String
    tanggal: Date
    nama_sekolah: String
}

extend type Query {
    allProyek: [Proyek!]! @all(model: "App\\Models\\ModelProyek") @softDeletes
    
    ProyekSearch(search: String!): [Proyek!]!
        @field(resolver: "App\\GraphQL\\Queries\\Proyek\\ProyekQueries@search")
}

extend type Mutation {
    createProyekInput(input: CreateProyekInput @spread): Proyek
        @create(model: "App\\Models\\ModelProyek")

    updateProyekInput(input: UpdateProyekInput @spread): Proyek
        @update(model: "App\\Models\\ModelProyek")

    deleteProyek(id: ID! @eq(key: "id")): Proyek
        @delete(model: "App\\Models\\ModelProyek")

    restoreProyek(id: ID! @eq(key: "id")): Proyek
        @field(
            resolver: "App\\GraphQL\\Mutations\\Proyek\\ProyekMutations@restore"
        )

    forceDeleteProyek(id: ID! @eq(key: "id")): Proyek
        @field(
            resolver: "App\\GraphQL\\Mutations\\Proyek\\ProyekMutations@forceDelete"
        )
}
