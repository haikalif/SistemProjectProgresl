type Status {
    id: ID!
    nama: String!
    created_at: DateTime
    updated_at: DateTime
    deleted_at: DateTime

    usersProfiles: [UserProfile!]! @hasMany
}

type StatusPaginator {
    data: [Status!]!
    PaginatorInfo: PageInfo!
}

extend type Query {
    allStatus: [Status!]! @all(model: "App\\Models\\ModelStatuses") @softDeletes

    allStatusPaginate(search: String, first: Int, page: Int): StatusPaginator
        @field(resolver: "App\\GraphQL\\Queries\\Status\\StatusQuery@all")

    Status(id: ID! @eq(key: "id")): Status
        @find(model: "App\\Models\\ModelStatuses")
        @softDeletes

    StatusByNama(
        nama: String! @where(operator: "like", key: "nama")
    ): [Status!]! @all(model: "App\\Models\\ModelStatuses") @softDeletes

    allArsipStatus: [Status!]!
        @field(resolver: "App\\GraphQL\\Queries\\Status\\StatusQuery@showTrashed")
        @softDeletes
}

extend type Mutation {
    createStatusInput(nama: String!): Status
        @create(model: "App\\Models\\ModelStatuses")

    updateStatusInput(id: ID!, nama: String!): Status
        @update(model: "App\\Models\\ModelStatuses")

    deleteStatus(id: ID! @eq(key: "id")): Status
        @delete(model: "App\\Models\\ModelStatuses")

    restoreStatus(id: ID! @eq(key: "id")): Status
        @field(
            resolver: "App\\GraphQL\\Mutations\\Status\\StatusMutations@restore"
        )

    forceDeleteStatus(id: ID! @eq(key: "id")): Status
        @field(
            resolver: "App\\GraphQL\\Mutations\\Status\\StatusMutations@forceDelete"
        )
}
